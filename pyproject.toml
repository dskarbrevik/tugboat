[project]
name = "tugboat"
version = "0.1.0"
author = [{name="David Skarbrevik"}]
description = "minimal AI web scraper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-mistralai>=0.2.10",
    "langgraph>=0.3.27",
]

[project.urls]
Homepage = "https://github.com/dskarbrevik/tugboat"
Issues = "https://github.com/dskarbrevik/tugboat/issues"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.5",
    "ruff>=0.11.4",
]

# [project.scripts]
# tb = "tugboat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tugboat"]
